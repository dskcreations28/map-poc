<div class="choropleth-card">
  <div class="choropleth-head">
    <h3>India — States &amp; Union Territories</h3>
    <span class="choropleth-sub">Synthetic index values (for demonstration)</span>
  </div>
  <div #mapContainer class="choropleth-map"></div>
  <div class="choropleth-actions">
    <button type="button" *ngIf="currentState" (click)="back()">&larr; Back to {{ currentDistrict ? 'Districts' : 'India' }}</button>
    <button type="button" *ngIf="currentDistrict" [class.active]="showMicromarkets" (click)="toggleMicromarkets()">
      {{ showMicromarkets ? 'Hide' : 'Show' }} Micromarkets
    </button>
    <span class="choropleth-crumb" *ngIf="currentState">
      India / {{ currentState }}<ng-container *ngIf="currentDistrictTitle"> / {{ currentDistrictTitle }}</ng-container>
    </span>
  </div>
  <p class="choropleth-note" *ngIf="error">{{ error }}</p>
</div>
